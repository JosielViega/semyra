name: Desktop CI

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore desktop/Semyra.Desktop.sln

      - name: Build
        run: dotnet build desktop/Semyra.Desktop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test desktop/Semyra.Desktop.sln --configuration Release --no-build
